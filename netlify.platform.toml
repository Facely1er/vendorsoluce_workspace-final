# VendorSoluce – Platform production (Netlify)
# Intended domain: e.g. https://platform.vendorsoluce.com
# Netlify UI: Base directory = empty (repo root), Configuration file = netlify.platform.toml
# Keep this file in sync with netlify.toml (same build, publish, redirects, headers).
# See NETLIFY_DEPLOYMENT.md for the full www / app / platform / portal map.

[build]
  command = "npm ci --include=dev --no-audit --no-fund && npm run build:app"
  publish = "packages/app/dist"

[build.environment]
  NODE_VERSION = "20"
  CI = "true"
  NODE_OPTIONS = "--max-old-space-size=6144"
  NPM_CONFIG_AUDIT = "false"
  NPM_CONFIG_FUND = "false"
  VITE_VERCEL_ANALYTICS = "false"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://rsms.me https://fonts.googleapis.com; font-src 'self' https://rsms.me https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.osv.dev https://www.googletagmanager.com https://www.google-analytics.com https://region1.google-analytics.com https://region1.analytics.google.com https://dfklqsdfycwjlcasfciu.supabase.co https://*.supabase.co https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"
