<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Portfolio Risk Report · VendorSoluce®</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Epilogue:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>

/* ── Tokens ────────────────────────────────────────────────────────────── */
:root {
  --ink:      #0D1F0F;
  --green:    #1A6B2E;
  --green-m:  #2E8B49;
  --green-l:  #EAF5ED;
  --green-p:  #F4FAF5;
  --mint:     #00C896;
  --c-crit:   #B91C1C; --cb-crit:#FEF2F2; --cd-crit:#FECACA;
  --c-high:   #C2410C; --cb-high:#FFF7ED; --cd-high:#FED7AA;
  --c-med:    #A16207; --cb-med:#FEFCE8;  --cd-med:#FEF08A;
  --c-low:    #15803D; --cb-low:#F0FDF4;  --cd-low:#BBF7D0;
  --bg:   #F6FAF6;
  --surf: #FFFFFF;
  --s2:   #F0F7F1;
  --bdr:  #D1E8D4;
  --bdr2: #B8D9BC;
  --mut:  #5A7A5E;
  --fnt:  #8FAD92;
  --font-serif:'Instrument Serif',Georgia,serif;
  --font-sans:'Epilogue',system-ui,sans-serif;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-xl:22px;
  --sh-sm:0 1px 4px rgba(13,31,15,.07);
  --sh-md:0 4px 16px rgba(13,31,15,.09);
  --sh-lg:0 8px 32px rgba(13,31,15,.1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);line-height:1.65}

/* ── Layout ──────────────────────────────────────────────────────────── */
.page{max-width:960px;margin:0 auto;padding:2rem 1.5rem 5rem}

/* ── Header ──────────────────────────────────────────────────────────── */
.rpt-header{
  background:var(--ink);border-radius:var(--r-xl);
  overflow:hidden;margin-bottom:1.25rem;
  box-shadow:var(--sh-lg);
  animation:rise .6s cubic-bezier(.22,1,.36,1) both;
}
.rpt-header-stripe{height:4px;background:linear-gradient(90deg,var(--green),var(--mint),#34d399)}
.rpt-header-body{
  padding:1.75rem 2rem;position:relative;overflow:hidden;
  display:grid;grid-template-columns:1fr auto;gap:1.5rem;align-items:start;
}
.rpt-header-body::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 80% at 95% 50%,rgba(0,200,150,.1),transparent),
             radial-gradient(ellipse 40% 60% at 5%  80%,rgba(26,107,46,.15),transparent);
}
.rpt-header-inner{position:relative;z-index:1}
.rpt-brand{font-size:.65rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--mint);margin-bottom:.375rem}
.rpt-doc-type{font-size:.7rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:.375rem}
.rpt-title{font-family:var(--font-serif);font-style:italic;font-size:clamp(1.5rem,3.5vw,2rem);color:#fff;line-height:1.15;margin-bottom:.875rem}
.rpt-meta{display:flex;flex-wrap:wrap;gap:.375rem .875rem;font-size:.75rem;color:rgba(255,255,255,.5)}
.rpt-meta span{display:inline-flex;align-items:center;gap:.3rem}
.rpt-meta svg{opacity:.55;flex-shrink:0}

/* KPI strip on header */
.rpt-kpis{
  position:relative;z-index:1;
  display:flex;flex-direction:column;gap:.5rem;min-width:160px;
}
.kpi-box{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  border-radius:var(--r-md);padding:.75rem 1rem;text-align:center;
}
.kpi-num{font-size:1.5rem;font-weight:800;line-height:1;color:#fff}
.kpi-lbl{font-size:.65rem;color:rgba(255,255,255,.45);margin-top:2px;letter-spacing:.06em}
@media(max-width:580px){.rpt-header-body{grid-template-columns:1fr}.rpt-kpis{flex-direction:row;flex-wrap:wrap}}

/* ── Action bar ──────────────────────────────────────────────────────── */
.action-bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.25rem;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:.375rem;padding:.5rem 1.125rem;border-radius:var(--r-md);font-family:var(--font-sans);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;border:none}
.btn-primary{background:var(--green);color:#fff}.btn-primary:hover{background:var(--green-m)}
.btn-outline{background:var(--surf);color:var(--mut);border:1px solid var(--bdr2)}.btn-outline:hover{border-color:var(--green);color:var(--green)}

/* ── Nav strip ───────────────────────────────────────────────────────── */
.nav-strip{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:.75rem 1rem;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r-md);margin-bottom:1.25rem;box-shadow:var(--sh-sm)}
.nav-label{font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin-right:4px}
.nav-strip a{font-size:.78rem;padding:.3rem .75rem;border-radius:var(--r-sm);border:1px solid var(--bdr);background:var(--s2);color:var(--mut);font-weight:500;transition:all .2s;text-decoration:none}
.nav-strip a:hover{border-color:var(--green);color:var(--green);background:var(--green-l)}

/* ── Section ─────────────────────────────────────────────────────────── */
.sec{margin-bottom:1rem;animation:rise .5s cubic-bezier(.22,1,.36,1) both}
.sec:nth-child(1){animation-delay:.05s}.sec:nth-child(2){animation-delay:.1s}
.sec:nth-child(3){animation-delay:.15s}.sec:nth-child(4){animation-delay:.2s}
.sec:nth-child(5){animation-delay:.25s}.sec:nth-child(6){animation-delay:.3s}
.sec:nth-child(7){animation-delay:.35s}.sec:nth-child(8){animation-delay:.4s}
.sec-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.875rem 1.25rem;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r-lg);cursor:pointer;text-align:left;transition:border-color .2s,background .2s;box-shadow:var(--sh-sm)}
.sec-toggle:hover{border-color:var(--green-m);background:var(--green-p)}
.sec.open .sec-toggle{border-radius:var(--r-lg) var(--r-lg) 0 0;border-bottom-color:transparent}
.sec-tl{display:flex;align-items:center;gap:.75rem}
.sec-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:var(--green);color:#fff;font-size:.7rem;font-weight:700;flex-shrink:0}
.sec-title{font-size:.9rem;font-weight:700;color:var(--ink)}
.sec-sub{font-size:.72rem;color:var(--fnt);margin-top:1px}
.sec-badges{display:flex;align-items:center;gap:6px}
.chevron{width:18px;height:18px;color:var(--fnt);transition:transform .25s;flex-shrink:0}
.sec.open .chevron{transform:rotate(180deg)}
.sec-body{display:none;border:1px solid var(--bdr);border-top:none;border-radius:0 0 var(--r-lg) var(--r-lg);background:var(--surf)}
.sec.open .sec-body{display:block}
.sec-inner{padding:1.25rem 1.5rem}

/* ── Badges ──────────────────────────────────────────────────────────── */
.b{display:inline-flex;align-items:center;font-size:.65rem;font-weight:700;padding:.2rem .625rem;border-radius:10px;border:1px solid;white-space:nowrap;letter-spacing:.04em}
.bc{background:var(--cb-crit);color:var(--c-crit);border-color:var(--cd-crit)}
.bh{background:var(--cb-high);color:var(--c-high);border-color:var(--cd-high)}
.bm{background:var(--cb-med); color:var(--c-med); border-color:var(--cd-med)}
.bl{background:var(--cb-low); color:var(--c-low); border-color:var(--cd-low)}
.bn{background:var(--s2);     color:var(--mut);   border-color:var(--bdr2)}

/* ── S1: Executive summary ───────────────────────────────────────────── */
.exec-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem}
@media(max-width:600px){.exec-grid{grid-template-columns:1fr 1fr}}
.exec-card{background:var(--s2);border:1px solid var(--bdr);border-radius:var(--r-md);padding:.875rem 1rem;text-align:center}
.exec-num{font-size:2rem;font-weight:800;line-height:1;color:var(--green)}
.exec-lbl{font-size:.65rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fnt);margin-top:.25rem}
.exec-sub{font-size:.7rem;color:var(--mut);margin-top:2px}
.exec-narrative{font-size:.875rem;color:var(--mut);line-height:1.65;padding:1rem 1.125rem;background:var(--green-p);border:1px solid var(--bdr);border-radius:var(--r-md)}
.exec-narrative strong{color:var(--ink)}

/* ── S2: Distribution ────────────────────────────────────────────────── */
.dist-bar-wrap{margin-bottom:1rem}
.dist-tier-row{display:grid;grid-template-columns:80px 1fr 50px 80px;gap:10px;align-items:center;margin-bottom:8px;font-size:.8rem}
.dist-tier-name{font-weight:600;color:var(--ink)}
.dist-bar-bg{height:10px;background:var(--bdr);border-radius:5px;overflow:hidden}
.dist-bar-fill{height:100%;border-radius:5px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.fill-crit{background:linear-gradient(90deg,var(--c-crit),#ef4444)}
.fill-high{background:linear-gradient(90deg,var(--c-high),#f97316)}
.fill-med{background:linear-gradient(90deg,var(--c-med),#eab308)}
.fill-low{background:linear-gradient(90deg,var(--c-low),var(--mint))}
.dist-count{text-align:right;font-weight:700;color:var(--ink)}
.dist-pct{text-align:right;color:var(--fnt);font-size:.75rem}

.trend-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:1rem}
@media(max-width:500px){.trend-row{grid-template-columns:1fr}}
.trend-card{background:var(--green-p);border:1px solid var(--bdr);border-radius:var(--r-md);padding:.875rem 1rem;font-size:.8rem}
.trend-card-label{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fnt);margin-bottom:.375rem}
.trend-card-value{font-size:1rem;font-weight:700;color:var(--ink)}
.trend-card-note{font-size:.72rem;color:var(--mut);margin-top:2px}

/* ── S3: Vendor table ────────────────────────────────────────────────── */
.vendor-table{width:100%;border-collapse:collapse;font-size:.8rem}
.vendor-table th{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fnt);text-align:left;padding:.625rem .875rem;border-bottom:2px solid var(--bdr);background:var(--s2)}
.vendor-table td{padding:.75rem .875rem;border-bottom:1px solid var(--bdr);vertical-align:middle}
.vendor-table tr:last-child td{border-bottom:none}
.vendor-table tr:hover td{background:var(--green-p)}
.vn{font-weight:600;color:var(--ink)}
.vt{font-size:.72rem;color:var(--mut)}
.score-pill{display:inline-flex;align-items:center;justify-content:center;width:36px;height:24px;border-radius:6px;font-size:.75rem;font-weight:700;border:1px solid}
.gap-flag{display:inline-flex;align-items:center;gap:.3rem;font-size:.7rem;font-weight:600;color:var(--c-high);background:var(--cb-high);border:1px solid var(--cd-high);padding:.18rem .5rem;border-radius:6px}

/* ── S4: Concentration ───────────────────────────────────────────────── */
.conc-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:560px){.conc-grid{grid-template-columns:1fr}}
.conc-section-title{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fnt);margin-bottom:.625rem}
.conc-bar-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-bottom:6px}
.conc-bar-label{font-size:.78rem;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conc-bar-count{font-size:.75rem;font-weight:700;color:var(--green);white-space:nowrap}
.conc-bar-track{grid-column:1/-1;height:5px;background:var(--bdr);border-radius:3px;overflow:hidden;margin-bottom:4px}
.conc-bar-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--mint));border-radius:3px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.conc-bar-fill.warn{background:linear-gradient(90deg,var(--c-high),#f97316)}

/* ── S5: Residual coverage ───────────────────────────────────────────── */
.coverage-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem}
@media(max-width:560px){.coverage-grid{grid-template-columns:1fr 1fr}}
.cov-card{background:var(--s2);border:1px solid var(--bdr);border-radius:var(--r-md);padding:.875rem 1rem;text-align:center}
.cov-card-tier{font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.375rem}
.cov-assessed{font-size:1.4rem;font-weight:800;line-height:1;color:var(--green)}
.cov-total{font-size:.75rem;color:var(--fnt)}
.cov-gap-bar{height:6px;background:var(--bdr);border-radius:3px;overflow:hidden;margin:.5rem 0}
.cov-gap-fill{height:100%;border-radius:3px;background:var(--green);transition:width .8s}
.cov-gap-label{font-size:.65rem;color:var(--fnt)}

/* ── S6: 4th-party ───────────────────────────────────────────────────── */
.subproc-row{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border:1px solid var(--bdr);border-radius:var(--r-md);background:var(--green-p);margin-bottom:.5rem}
.subproc-name{font-weight:700;font-size:.875rem;flex:1}
.subproc-count{font-size:.75rem;color:var(--mut)}
.subproc-bar-wrap{flex:1;max-width:120px}
.subproc-bar-bg{height:5px;background:var(--bdr);border-radius:3px;overflow:hidden}
.subproc-bar-f{height:100%;background:linear-gradient(90deg,var(--green),var(--mint));border-radius:3px;transition:width 1s}
.subproc-bar-f.warn{background:linear-gradient(90deg,var(--c-crit),#ef4444)}

/* ── S7: Regulatory ──────────────────────────────────────────────────── */
.reg-summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
@media(max-width:560px){.reg-summary-grid{grid-template-columns:1fr 1fr}}
.reg-sum-card{background:var(--s2);border:1px solid var(--bdr);border-radius:var(--r-md);padding:.875rem 1rem;text-align:center}
.reg-sum-num{font-size:1.5rem;font-weight:800;color:var(--green)}
.reg-sum-lbl{font-size:.65rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fnt);margin-top:3px}
.fw-row{display:flex;align-items:center;gap:.75rem;padding:.625rem .875rem;border-bottom:1px solid var(--bdr);font-size:.8rem}
.fw-row:last-child{border-bottom:none}
.fw-name{font-weight:600;flex:1}
.fw-count{font-size:.75rem;color:var(--mut)}
.fw-pct{font-size:.75rem;font-weight:600;color:var(--green)}

/* ── S8: Action register ─────────────────────────────────────────────── */
.action-table{width:100%;border-collapse:collapse;font-size:.8rem}
.action-table th{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fnt);text-align:left;padding:.625rem .875rem;border-bottom:2px solid var(--bdr);background:var(--s2)}
.action-table td{padding:.75rem .875rem;border-bottom:1px solid var(--bdr);vertical-align:top;line-height:1.5}
.action-table tr:last-child td{border-bottom:none}
.action-table tr:hover td{background:var(--green-p)}
.urgency-pill{display:inline-flex;align-items:center;font-size:.65rem;font-weight:700;padding:.2rem .6rem;border-radius:10px;border:1px solid;white-space:nowrap}
.u-immediate{background:var(--cb-crit);color:var(--c-crit);border-color:var(--cd-crit)}
.u-soon{background:var(--cb-high);color:var(--c-high);border-color:var(--cd-high)}
.u-planned{background:var(--cb-med);color:var(--c-med);border-color:var(--cd-med)}
.action-title{font-weight:600;color:var(--ink)}
.action-vendor{font-size:.72rem;color:var(--mut)}

/* ── Empty state ─────────────────────────────────────────────────────── */
.empty-state{text-align:center;padding:3rem 2rem;background:var(--surf);border:1px dashed var(--bdr);border-radius:var(--r-xl);margin-top:1rem}
.empty-icon{font-size:2.5rem;margin-bottom:.75rem;opacity:.3}
.empty-title{font-weight:700;font-size:1.1rem;margin-bottom:.375rem}
.empty-desc{font-size:.875rem;color:var(--mut);max-width:400px;margin:0 auto 1.25rem;line-height:1.6}

/* ── Animations ──────────────────────────────────────────────────────── */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ── Print ───────────────────────────────────────────────────────────── */
@media print{
  body{background:#fff}
  .action-bar,.nav-strip{display:none!important}
  .sec-body{display:block!important}
  .sec.open .sec-toggle{border-radius:var(--r-lg);border-bottom:1px solid var(--bdr)}
  .chevron{display:none}
  .rpt-header{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sec{break-inside:avoid}
}
</style>
</head>
<body>
<div class="page" id="page">
  <div id="mount"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   VendorSoluce® — Vendor Portfolio Risk Report
   Data sources:
   • localStorage 'vs_portfolio' — intake / VendorPortfolio.addVendor()
   • sessionStorage 'vs_portfolio_import' — one-shot sync from Vendor Risk Radar
     (see packages/app/src/utils/vendorPortfolioReportSync.ts); same origin only.
   Demo sample vendors: append ?demo=1 to this page when portfolio is empty.
   ══════════════════════════════════════════════════════════════════════ */

const STORAGE_KEY = 'vs_portfolio';
/** Same-origin handoff from Vendor Risk Radar (see vendorPortfolioReportSync.ts) */
const RADAR_IMPORT_KEY = 'vs_portfolio_import';

(function consumeRadarPortfolioImport() {
  try {
    const raw = sessionStorage.getItem(RADAR_IMPORT_KEY);
    if (!raw) return;
    sessionStorage.removeItem(RADAR_IMPORT_KEY);
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed) && parsed.length > 0) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
    }
  } catch (e) {
    console.warn('Vendor portfolio Radar import failed', e);
  }
})();

function addVendorUrl() {
  var h = location.hostname;
  if (h === 'localhost' || h === '127.0.0.1') return '/vendor-risk-radar';
  if (h.indexOf('platform.') !== -1 || h === 'platform.vendorsoluce.com') return '/vendor-risk-radar';
  return 'vendor-intake.html';
}

/* ── Portfolio store ─────────────────────────────────────────────────── */
const VendorPortfolio = {
  addVendor(vendorConfig) {
    // Expects the same config shape as renderVendorRiskReport()
    // Runs the scoring engine and stores the result
    const result = VendorInherentRisk
      ? VendorInherentRisk.calculate(vendorConfig)
      : mockCalculate(vendorConfig);
    const entry = {
      id:          vendorConfig.vendorName.replace(/\s+/g,'-').toLowerCase() + '-' + Date.now(),
      assessed_at: new Date().toISOString(),
      residual_assessed: false,
      ...vendorConfig,
      score:       result.score,
      tier:        result.tier.id,
      domainScores:result.domainScores,
      overrides:   result.overrides.map(o=>o.reason),
    };
    const portfolio = this.getAll();
    // Replace if same vendor name exists
    const idx = portfolio.findIndex(v => v.vendorName === vendorConfig.vendorName);
    if (idx >= 0) portfolio[idx] = entry; else portfolio.push(entry);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(portfolio));
    return entry;
  },
  getAll() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); } catch(e){ return []; }
  },
  clear() { localStorage.removeItem(STORAGE_KEY); },
};
window.VendorPortfolio = VendorPortfolio;

/* Fallback scoring if engine not loaded on this page */
function mockCalculate(cfg) {
  const score = cfg.score || 50;
  /* Bands aligned with packages/app/src/utils/riskCalculations.ts inherentRiskTierFromScore (90 / 70 / 40). */
  const tiers = [{min:90,id:'critical',label:'Critical',color:'#B91C1C',bg:'rgba(185,28,28,.12)',border:'rgba(185,28,28,.3)'},{min:70,id:'high',label:'High',color:'#C2410C',bg:'rgba(194,65,12,.12)',border:'rgba(194,65,12,.3)'},{min:40,id:'medium',label:'Medium',color:'#A16207',bg:'rgba(161,98,7,.12)',border:'rgba(161,98,7,.3)'},{min:0,id:'low',label:'Low',color:'#15803D',bg:'rgba(21,128,61,.12)',border:'rgba(21,128,61,.3)'}];
  return { score, tier: tiers.find(t=>score>=t.min)||tiers[3], domainScores:{}, overrides:[] };
}

/* ── Tier config ─────────────────────────────────────────────────────── */
const TIERS = {
  critical:{ label:'Critical', color:'var(--c-crit)', cls:'bc', fillCls:'fill-crit' },
  high:    { label:'High',     color:'var(--c-high)', cls:'bh', fillCls:'fill-high' },
  medium:  { label:'Medium',   color:'var(--c-med)',  cls:'bm', fillCls:'fill-med'  },
  low:     { label:'Low',      color:'var(--c-low)',  cls:'bl', fillCls:'fill-low'  },
};

function chevron(){return`<svg class="chevron" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>`}
function toggleSec(b){b.closest('.sec').classList.toggle('open')}
function fmtDate(s){return new Date(s).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'})}
function pct(n,d){return d>0?Math.round(n/d*100):0}

/* ── Main render ─────────────────────────────────────────────────────── */
function renderPortfolio() {
  const vendors = VendorPortfolio.getAll();
  const mount = document.getElementById('mount');

  if (!vendors.length) {
    mount.innerHTML = renderHeader({total:0,critical:0,high:0,avgScore:0}) + renderEmpty();
    return;
  }

  const stats = computeStats(vendors);

  mount.innerHTML = [
    renderHeader(stats),
    renderActionBar(),
    renderNavStrip(),
    renderExecSummary(stats, vendors),
    renderDistribution(stats),
    renderVendorTable(vendors, stats),
    renderConcentration(vendors, stats),
    renderResidualCoverage(vendors, stats),
    renderFourthParty(vendors),
    renderRegulatory(vendors, stats),
    renderActionRegister(vendors, stats),
  ].join('');

  // Animate bars
  requestAnimationFrame(()=>{
    document.querySelectorAll('[data-fill]').forEach(el=>{
      el.style.width = el.dataset.fill+'%';
    });
  });

  // Export
  document.getElementById('btn-export')?.addEventListener('click',()=>{
    const payload = {exported_at:new Date().toISOString(),stats,vendors};
    const blob = new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href=url; a.download=`vendor-portfolio-${new Date().toISOString().split('T')[0]}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  });

  document.getElementById('btn-print')?.addEventListener('click',()=>window.print());
  document.getElementById('btn-add')?.addEventListener('click',()=>{ window.location.href = addVendorUrl(); });
}

/* ── Stats computation ───────────────────────────────────────────────── */
function computeStats(vendors) {
  const byTier = {critical:[],high:[],medium:[],low:[]};
  vendors.forEach(v=>{ if(byTier[v.tier]) byTier[v.tier].push(v); });

  const scores  = vendors.map(v=>v.score||0);
  const avgScore= Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);

  // Residual coverage
  const residualByTier = {};
  Object.keys(byTier).forEach(t=>{
    const total    = byTier[t].length;
    const assessed = byTier[t].filter(v=>v.residual_assessed).length;
    residualByTier[t] = { total, assessed, gap: total - assessed };
  });

  // Regulatory surface
  const fwCounts = {};
  let baaRequired=0, dpaRequired=0;
  vendors.forEach(v=>{
    const r = v.regulatorySurface || {};
    (r.frameworks||[]).forEach(f=>{ fwCounts[f]=(fwCounts[f]||0)+1; });
    if(r.baaRequired) baaRequired++;
    if(r.dpaRequired) dpaRequired++;
  });

  // Vendor type concentration
  const typeCounts = {};
  vendors.forEach(v=>{ const t=v.vendorType||'Other'; typeCounts[t]=(typeCounts[t]||0)+1; });

  // Data category concentration
  const catCounts = {};
  vendors.forEach(v=>{
    ((v.dataSensitivity||{}).categories||[]).forEach(c=>{catCounts[c]=(catCounts[c]||0)+1;});
  });

  // Sub-processor concentration
  const subCounts = {};
  vendors.forEach(v=>{
    (v.subprocessors||[]).forEach(s=>{subCounts[s.name]=(subCounts[s.name]||0)+1;});
  });

  // Action register
  const actions = buildActions(vendors);

  return {
    total:   vendors.length,
    byTier,  avgScore, residualByTier,
    fwCounts, baaRequired, dpaRequired,
    typeCounts, catCounts, subCounts,
    actions,
    unverifiedHigh: [...byTier.critical,...byTier.high].filter(v=>!v.residual_assessed).length,
  };
}

function buildActions(vendors) {
  const actions = [];
  vendors.forEach(v=>{
    const r = v.regulatorySurface || {};
    // No residual assessment on critical/high
    if((v.tier==='critical'||v.tier==='high') && !v.residual_assessed)
      actions.push({ urgency:'immediate', title:'Residual risk assessment required', vendor:v.vendorName, tier:v.tier, detail:`${TIERS[v.tier].label}-risk vendor has no completed security questionnaire or evidence review.` });
    // BAA missing
    if(r.baaRequired && !v.baaExecuted)
      actions.push({ urgency:'immediate', title:'HIPAA BAA not yet executed', vendor:v.vendorName, tier:v.tier, detail:'Vendor handles PHI. BAA must be in place before any data sharing.' });
    // DPA missing
    if(r.dpaRequired && !v.dpaExecuted)
      actions.push({ urgency:'soon', title:'Data Processing Agreement required', vendor:v.vendorName, tier:v.tier, detail:'GDPR/MODPA requires a signed DPA before personal data processing begins.' });
    // Assessment aging (>365 days)
    if(v.assessed_at) {
      const age = (Date.now() - new Date(v.assessed_at).getTime()) / 864e5;
      if(age > 365)
        actions.push({ urgency:'soon', title:'Inherent risk reassessment overdue', vendor:v.vendorName, tier:v.tier, detail:`Assessment is ${Math.round(age)} days old. Annual refresh required.` });
    }
    // Sole provider + no alternative
    if((v.concentration||{}).isSoleProvider && (v.operationalCriticality||{}).businessImpact==='mission-critical')
      actions.push({ urgency:'planned', title:'Single point of failure — no documented contingency', vendor:v.vendorName, tier:v.tier, detail:'Sole provider of a mission-critical function. Document contingency plan or identify alternative.' });
  });
  // Sort by urgency
  const order = {immediate:0,soon:1,planned:2};
  return actions.sort((a,b)=>order[a.urgency]-order[b.urgency]);
}

  const total = stats.total || 1;
  const rows = ['critical','high','medium','low'].map(t=>{

    const p     = pct(count, total);
    const T     = TIERS[t];
    return `<div class="dist-tier-row">
      <div class="dist-tier-name"><span class="b ${T.cls}">${T.label}</span></div>
      <div class="dist-bar-bg"><div class="dist-bar-fill ${T.fillCls}" data-fill="${p}" style="width:0%"></div></div>
      <div class="dist-count">${count}</div>
      <div class="dist-pct">${p}%</div>
    </div>`;
  }).join('');

  const topScore = Math.max(...stats.byTier.critical.concat(stats.byTier.high).map(v=>v.score||0),0);
  const soleproviders = Object.values(stats.byTier).flat().filter(v=>(v.concentration||{}).isSoleProvider).length;

  return `
  <div class="sec open" id="s2">
    <button class="sec-toggle" onclick="toggleSec(this)">
      <div class="sec-tl">
        <span class="sec-num">2</span>
        <div><div class="sec-title">Portfolio risk distribution</div><div class="sec-sub">Vendor count and percentage by tier</div></div>

      <div class="trend-row">
        <div class="trend-card">
          <div class="trend-card-label">Highest individual score</div>

}

      flags.push(`<span class="gap-flag">BAA missing</span>`);
    if((v.regulatorySurface||{}).dpaRequired && !v.dpaExecuted)

function renderRegulatory(vendors, stats) {
  const total = vendors.length || 1;
  const fwRows = Object.entries(stats.fwCounts)
    .sort((a,b)=>b[1]-a[1])
    .map(([fw,count])=>`
      <div class="fw-row">
        <div class="fw-name">${fw}</div>
        <div class="fw-count">${count} vendor${count!==1?'s':''}</div>

      </div>`).join('');

  const dpaGap = vendors.filter(v=>(v.regulatorySurface||{}).dpaRequired && !v.dpaExecuted).length;

  return `
  <div class="sec" id="s7">
    <button class="sec-toggle" onclick="toggleSec(this)">
      <div class="sec-tl">
        <span class="sec-num">7</span>
        <div><div class="sec-title">Regulatory obligations inventory</div><div class="sec-sub">Framework coverage and contractual requirement gaps</div></div>
      </div>
      <div class="sec-badges">
        ${baaGap>0?`<span class="b bc">${baaGap} BAA gap${baaGap!==1?'s':''}</span>`:''}
        ${dpaGap>0?`<span class="b bh">${dpaGap} DPA gap${dpaGap!==1?'s':''}</span>`:''}
        ${chevron()}
      </div>
    </button>
    <div class="sec-body"><div class="sec-inner">
      <div class="reg-summary-grid">
        <div class="reg-sum-card">
          <div class="reg-sum-num">${Object.keys(stats.fwCounts).length}</div>
          <div class="reg-sum-lbl">Frameworks in scope</div>
        </div>
        <div class="reg-sum-card" style="${baaGap>0?'background:var(--cb-crit);border-color:var(--cd-crit)':''}">
          <div class="reg-sum-num" style="${baaGap>0?'color:var(--c-crit)':''}">${baaGap}</div>
          <div class="reg-sum-lbl">BAA gaps</div>
        </div>
        <div class="reg-sum-card" style="${dpaGap>0?'background:var(--cb-high);border-color:var(--cd-high)':''}">
          <div class="reg-sum-num" style="${dpaGap>0?'color:var(--c-high)':''}">${dpaGap}</div>
          <div class="reg-sum-lbl">DPA gaps</div>
        </div>
      </div>
      <div style="border:1px solid var(--bdr);border-radius:var(--r-md);overflow:hidden">
        ${fwRows || '<div class="fw-row"><div class="fw-name" style="color:var(--fnt)">No frameworks recorded</div></div>'}
      </div>
    </div></div>
  </div>`;
}

function renderActionRegister(vendors, stats) {
  const actions = stats.actions;
  const urgencyMap = {immediate:{label:'Immediate',cls:'u-immediate'},soon:{label:'Soon',cls:'u-soon'},planned:{label:'Planned',cls:'u-planned'}};

  const rows = actions.map(a=>{
    const T = TIERS[a.tier]||TIERS.low;
    const U = urgencyMap[a.urgency];
    return `<tr>
      <td><span class="urgency-pill ${U.cls}">${U.label}</span></td>
      <td><div class="action-title">${a.title}</div><div style="font-size:.72rem;color:var(--mut);margin-top:2px">${a.detail}</div></td>
      <td><div class="action-vendor">${a.vendor}</div></td>
      <td><span class="b ${T.cls}">${T.label}</span></td>
    </tr>`;
  }).join('');

  const immediateCount = actions.filter(a=>a.urgency==='immediate').length;

  return `
  <div class="sec open" id="s8">
    <button class="sec-toggle" onclick="toggleSec(this)">
      <div class="sec-tl">
        <span class="sec-num">8</span>
        <div><div class="sec-title">Action register</div><div class="sec-sub">Items requiring follow-up, sorted by urgency</div></div>
      </div>
      <div class="sec-badges">
        ${immediateCount>0?`<span class="b bc">${immediateCount} immediate</span>`:'<span class="b bl">No immediate actions</span>'}
        ${chevron()}
      </div>
    </button>
    <div class="sec-body">
      ${actions.length
        ? `<div style="overflow-x:auto"><table class="action-table">
            <thead><tr><th>Urgency</th><th>Action required</th><th>Vendor</th><th>Tier</th></tr></thead>
            <tbody>${rows}</tbody>
           </table></div>`
        : `<div class="sec-inner"><p style="font-size:.875rem;color:var(--fnt);text-align:center;padding:1rem 0">No outstanding actions. All high-priority items are resolved.</p></div>`}
    </div>
  </div>`;
}

function renderEmpty() {
  return `<div class="empty-state">
    <div class="empty-icon">📋</div>
    <div class="empty-title">No vendors assessed yet</div>
    <p class="empty-desc">Complete vendor intake assessments to populate your portfolio. Each assessment stores results automatically — this report updates in real time.</p>
    <a href="vendor-intake.html" class="btn btn-primary" style="display:inline-flex;align-items:center;gap:.375rem;text-decoration:none">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
      Start first vendor assessment →
    </a>
  </div>`;
}
