# VendorSoluce – Vendor Risk Portal (Netlify)
# Use this config for the portal deploy (www.portal.vendorsoluce.com).
#
# Netlify site settings:
#   Base directory:    leave EMPTY (build runs from repo root so npm ci installs all workspaces)
#   Build command:     npm ci --no-audit && npm run build:portal
#   Publish directory: packages/vendor-risk-portal/dist
#   Config file path:  packages/vendor-risk-portal/netlify.toml

[build]
  command = "npm ci --no-audit && npm run build:portal"
  publish = "packages/vendor-risk-portal/dist"

[build.environment]
  NODE_VERSION = "20"

# Serve static assets with correct MIME types (must come before SPA catch-all)
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = false

# SPA: serve index.html for all other client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://*.stripe.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Ensure correct MIME types for assets (fallback if redirect still served wrong type)
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"
