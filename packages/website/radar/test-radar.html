    <style>

        body { font-family: 'Inter', system-ui, sans-serif; background: #f0f2f5; color: #1f2937; padding: 24px; }

        .section--log { margin-top: 16px; }
        .radar-test-frame { display: none; width: 1280px; height: 900px; border: none; }
        #log { font-family: 'Fira Code', monospace; font-size: 0.75rem; background: #111827; color: #d1d5db; padding: 12px; border-radius: 6px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; }
        @media (max-width: 640px) { .summary { grid-template-columns: repeat(2, 1fr); } }

<body>
    <h1>Vendor Threat Radar - Test Suite</h1>
    <p class="subtitle">Automated functional verification for vendor-threat-radar.html</p>

    <div class="controls">
        <button class="btn-run" onclick="runAllTests()">Run All Tests</button>
        <button class="btn-reset" onclick="resetTests()">Reset</button>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="summary">
        <div class="summary-card total"><div class="num" id="totalCount">0</div><div class="label">Total</div></div>
        <div class="summary-card pass"><div class="num" id="passCount">0</div><div class="label">Passed</div></div>
        <div class="summary-card fail"><div class="num" id="failCount">0</div><div class="label">Failed</div></div>
        <div class="summary-card skip"><div class="num" id="skipCount">0</div><div class="label">Skipped</div></div>
    </div>

    <div id="results"></div>

    <div class="section section--log">
        <div class="section-title">Console Log</div>
        <div id="log"></div>
    </div>

    <iframe id="radarFrame" class="radar-test-frame" src="vendor-threat-radar.html"></iframe>

<script>
const results = { pass: 0, fail: 0, skip: 0, total: 0 };
const sections = {};
let logEl, frame, frameDoc, frameWin;

function log(msg) {
    if (!logEl) logEl = document.getElementById('log');
    const ts = new Date().toISOString().split('T')[1].split('.')[0];
    logEl.textContent += `[${ts}] ${msg}\n`;
    logEl.scrollTop = logEl.scrollHeight;
}

function addResult(section, name, status, detail) {
    if (!sections[section]) {
        sections[section] = [];
        const el = document.createElement('div');
        el.className = 'section';
        el.innerHTML = `<div class="section-title">${section}</div><div id="section-${section.replace(/\s/g, '-')}"></div>`;
        document.getElementById('results').appendChild(el);
    }
    sections[section].push({ name, status, detail });
    results[status]++;
    results.total++;

    const container = document.getElementById(`section-${section.replace(/\s/g, '-')}`);
    const row = document.createElement('div');
    row.className = `test-row ${status}`;
    row.innerHTML = `<span class="badge ${status}">${status}</span><span class="test-name">${name}</span>${detail ? `<span class="test-detail">${detail}</span>` : ''}`;
    container.appendChild(row);

    document.getElementById('totalCount').textContent = results.total;
    document.getElementById('passCount').textContent = results.pass;
    document.getElementById('failCount').textContent = results.fail;
    document.getElementById('skipCount').textContent = results.skip;
    const pct = Math.round((results.total / expectedTotal) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
}

function assert(section, name, condition, detail) {
    if (condition) {
        addResult(section, name, 'pass', detail || '');
        log(`PASS: ${name}`);
    } else {
        addResult(section, name, 'fail', detail || '');
        log(`FAIL: ${name} — ${detail || ''}`);
    }
}

function assertExists(section, name, selector, detail) {
    const el = frameDoc.querySelector(selector);
    assert(section, name, !!el, detail || (el ? 'Found' : `Selector "${selector}" not found`));
    return el;
}

const expectedTotal = 45;

function resetTests() {
    results.pass = 0; results.fail = 0; results.skip = 0; results.total = 0;
    Object.keys(sections).forEach(k => delete sections[k]);
    document.getElementById('results').innerHTML = '';
    document.getElementById('log').textContent = '';
    document.getElementById('totalCount').textContent = '0';
    document.getElementById('passCount').textContent = '0';
    document.getElementById('failCount').textContent = '0';
    document.getElementById('skipCount').textContent = '0';
    document.getElementById('progressFill').style.width = '0%';
}

async function waitFor(condFn, timeout = 5000, interval = 100) {
    const start = Date.now();
    while (Date.now() - start < timeout) {
        if (condFn()) return true;
        await new Promise(r => setTimeout(r, interval));
    }
    return false;
}

async function runAllTests() {
    resetTests();
    frame = document.getElementById('radarFrame');
    log('Waiting for radar page to load...');

    await new Promise(resolve => {
        if (frame.contentDocument && frame.contentDocument.readyState === 'complete') {
            resolve();
        } else {
            frame.onload = resolve;
        }
    });

    frameDoc = frame.contentDocument;
    frameWin = frame.contentWindow;

    await new Promise(r => setTimeout(r, 1500));
    log('Radar page loaded. Running tests...\n');

    testHTMLStructure();
    testCSSAndStyles();
    testDOMElements();
    testNavigation();
    testRadarContent();
    testJavaScriptGlobals();
    testRiskCalculation();
    testVendorCRUD();
    testUIUpdates();
    testChartSetup();
    testExportImport();
    testDarkMode();

    log(`\n========================================`);
    log(`Tests complete: ${results.pass} passed, ${results.fail} failed, ${results.skip} skipped out of ${results.total}`);
    log(`========================================`);
}

function testHTMLStructure() {
    const S = 'HTML Structure';
    assert(S, 'DOCTYPE is html', frameDoc.doctype && frameDoc.doctype.name === 'html');
    assert(S, '<html lang="en"> present', frameDoc.documentElement.getAttribute('lang') === 'en');
    assertExists(S, '<head> has <title>', 'head title');
    assert(S, 'Title contains "Vendor"', (frameDoc.title || '').includes('Vendor'), frameDoc.title);
    assertExists(S, '<body> exists', 'body');
    assertExists(S, '<main> element exists', 'main');
    assert(S, '<main> has id="radar-main"', frameDoc.querySelector('main')?.id === 'radar-main');
}

function testCSSAndStyles() {
    const S = 'CSS & Styles';
    const tailwind = frameDoc.querySelector('link[href*="tailwind"]');
    assert(S, 'Tailwind CSS linked', !!tailwind, tailwind ? tailwind.href : 'Not found');
    const chartJS = frameDoc.querySelector('script[src*="chart.js"]');
    assert(S, 'Chart.js loaded', !!chartJS, chartJS ? chartJS.src : 'Not found');
    const rootStyles = frameDoc.querySelector('style');
    assert(S, 'Custom styles present', !!rootStyles);
    const body = frameDoc.body;
    const bg = frameWin.getComputedStyle(body).backgroundColor;
    assert(S, 'Body has background color', bg && bg !== '', bg);
}

function testDOMElements() {
    const S = 'DOM Elements';
    assertExists(S, 'Radar container', '.radar-container');
    assertExists(S, 'Radar header', '.radar-header');
    assertExists(S, 'Radar header <h1>', '.radar-header h1');
    assertExists(S, 'Alert banner', '#alertBanner');
    assertExists(S, 'Toolbar', '.toolbar');
    assertExists(S, 'Stats grid', '.stats-grid');
    assertExists(S, 'Sonar canvas', '#sonarCanvas');
    assertExists(S, 'Vendor list container', '#vendorList');
    assertExists(S, 'Risk filter dropdown', '#riskFilter');
    assertExists(S, 'Vendor modal', '#vendorModal');
    assertExists(S, 'Vendor form', '#vendorForm');
    assertExists(S, 'Timestamp element', '#timestamp');
}

function testNavigation() {
    const S = 'Navigation';
    assertExists(S, '<nav> element exists', 'nav');
    assertExists(S, 'Nav has fixed positioning class', 'nav.fixed, nav[class*="fixed"]');
    assertExists(S, 'Brand link to index', 'nav a[href*="index"]');
    assertExists(S, 'Mobile menu button', '[data-mobile-menu-button]');
    const mobileMenu = frameDoc.querySelector('[data-mobile-menu]');
    assert(S, 'Mobile menu panel exists', !!mobileMenu);
    if (mobileMenu) {
        assert(S, 'Mobile menu is initially hidden', mobileMenu.classList.contains('hidden'));
    }
}

function testRadarContent() {
    const S = 'Radar Content';
    const statCards = frameDoc.querySelectorAll('.stat-card');
    assert(S, 'Stats grid has 8 cards', statCards.length === 8, `Found ${statCards.length}`);
    assertExists(S, 'Critical count element', '#criticalCount');
    assertExists(S, 'High count element', '#highCount');
    assertExists(S, 'Total count element', '#totalCount');
    assertExists(S, 'Avg risk element', '#avgRisk');
    const charts = frameDoc.querySelectorAll('.chart-card');
    assert(S, '3 chart cards present', charts.length === 3, `Found ${charts.length}`);
    assertExists(S, 'Inherent risk chart canvas', '#inherentChart');
    assertExists(S, 'Sector chart canvas', '#sectorChart');
    assertExists(S, 'Geo chart canvas', '#geoChart');
}

function testJavaScriptGlobals() {
    const S = 'JavaScript Globals';
    assert(S, 'vendorData is defined', typeof frameWin.vendorData !== 'undefined');
    assert(S, 'vendorData is an array', Array.isArray(frameWin.vendorData));
    assert(S, 'vendorData has sample vendors', frameWin.vendorData && frameWin.vendorData.length >= 3, `Length: ${frameWin.vendorData?.length}`);
    assert(S, 'openAddVendor is a function', typeof frameWin.openAddVendor === 'function');
    assert(S, 'closeVendorModal is a function', typeof frameWin.closeVendorModal === 'function');
    assert(S, 'scanVendors is a function', typeof frameWin.scanVendors === 'function');
    assert(S, 'filterVendors is a function', typeof frameWin.filterVendors === 'function');
    assert(S, 'exportVendors is a function', typeof frameWin.exportVendors === 'function');
    assert(S, 'toggleDarkMode is a function', typeof frameWin.toggleDarkMode === 'function');
    assert(S, 'generateComprehensiveReport is a function', typeof frameWin.generateComprehensiveReport === 'function');
}

function testRiskCalculation() {
    const S = 'Risk Calculation';
    if (!frameWin.vendorData || frameWin.vendorData.length === 0) {
        addResult(S, 'Skipped - no vendor data', 'skip');
        return;
    }
    const v = frameWin.vendorData[0];
    assert(S, 'Vendor has inherentRisk', typeof v.inherentRisk === 'number', `Value: ${v.inherentRisk}`);
    assert(S, 'Vendor has residualRisk', typeof v.residualRisk === 'number', `Value: ${v.residualRisk}`);
    assert(S, 'Vendor has riskLevel', ['critical', 'high', 'medium', 'low'].includes(v.riskLevel), `Level: ${v.riskLevel}`);
    assert(S, 'inherentRisk in range 0-200', v.inherentRisk >= 0 && v.inherentRisk <= 200, `Value: ${v.inherentRisk}`);
    assert(S, 'residualRisk <= inherentRisk', v.residualRisk <= v.inherentRisk, `Residual: ${v.residualRisk}, Inherent: ${v.inherentRisk}`);
    assert(S, 'Vendor has complianceGaps', Array.isArray(v.complianceGaps), `Type: ${typeof v.complianceGaps}`);
    assert(S, 'Vendor has securityControls', Array.isArray(v.securityControls), `Type: ${typeof v.securityControls}`);
}

function testVendorCRUD() {
    const S = 'Vendor CRUD';
    const initialCount = frameWin.vendorData.length;

    frameWin.openAddVendor();
    const modal = frameDoc.getElementById('vendorModal');
    assert(S, 'Modal opens on openAddVendor()', modal && modal.classList.contains('active'), modal ? `Classes: ${modal.className}` : 'Modal not found');

    frameWin.closeVendorModal();
    const modalAfter = frameDoc.getElementById('vendorModal');
    assert(S, 'Modal closes on closeVendorModal()', modalAfter && !modalAfter.classList.contains('active'));

    if (frameWin.vendorData.length > 0) {
        const firstId = frameWin.vendorData[0].id;
        frameWin.editVendor(firstId);
        const modalTitle = frameDoc.getElementById('modalTitle');
        assert(S, 'editVendor opens modal with "Edit" title', modalTitle && modalTitle.textContent.includes('Edit'), `Title: ${modalTitle?.textContent}`);
        frameWin.closeVendorModal();
    } else {
        addResult(S, 'editVendor - skipped (no vendors)', 'skip');
    }

    assert(S, 'Vendor count unchanged after open/close', frameWin.vendorData.length === initialCount, `Before: ${initialCount}, After: ${frameWin.vendorData.length}`);
}

function testUIUpdates() {
    const S = 'UI Updates';
    const totalEl = frameDoc.getElementById('totalCount');
    if (totalEl) {
        const displayed = parseInt(totalEl.textContent);
        assert(S, 'Total count matches vendorData.length', displayed === frameWin.vendorData.length, `Displayed: ${displayed}, Actual: ${frameWin.vendorData.length}`);
    } else {
        addResult(S, 'Total count element missing', 'fail');
    }

    const timestamp = frameDoc.getElementById('timestamp');
    assert(S, 'Timestamp is populated', timestamp && timestamp.textContent.length > 0, `Content: "${timestamp?.textContent}"`);

    const vendorList = frameDoc.getElementById('vendorList');
    if (vendorList) {
        const items = vendorList.querySelectorAll('.vendor-item');
        assert(S, 'Vendor list renders items', items.length > 0 || frameWin.vendorData.length === 0, `Rendered: ${items.length}`);
    }

    const alertBanner = frameDoc.getElementById('alertBanner');
    assert(S, 'Alert banner has content', alertBanner && alertBanner.textContent.trim().length > 0);
}

function testChartSetup() {
    const S = 'Chart Setup';
    const inherentCanvas = frameDoc.getElementById('inherentChart');
    const sectorCanvas = frameDoc.getElementById('sectorChart');
    const geoCanvas = frameDoc.getElementById('geoChart');

    assert(S, 'Inherent chart canvas exists', !!inherentCanvas);
    assert(S, 'Sector chart canvas exists', !!sectorCanvas);
    assert(S, 'Geo chart canvas exists', !!geoCanvas);

    const hasChartJS = typeof frameWin.Chart !== 'undefined';
    assert(S, 'Chart.js library loaded', hasChartJS, hasChartJS ? `Version: ${frameWin.Chart?.version}` : 'Chart.js not available');
}

function testExportImport() {
    const S = 'Export & Import';
    assert(S, 'exportVendors is callable', typeof frameWin.exportVendors === 'function');
    assert(S, 'importVendors is callable', typeof frameWin.importVendors === 'function');
    const csvInput = frameDoc.getElementById('csvImport');
    assert(S, 'CSV file input exists', !!csvInput);
    assert(S, 'CSV input accepts .csv', csvInput && csvInput.getAttribute('accept') === '.csv');
    assert(S, 'clearAllVendors is callable', typeof frameWin.clearAllVendors === 'function');
    assert(S, 'generateComprehensiveReport is callable', typeof frameWin.generateComprehensiveReport === 'function');
}

function testDarkMode() {
    const S = 'Dark Mode';
    const html = frameDoc.documentElement;
    const wasDark = html.classList.contains('dark');

    if (typeof frameWin.toggleDarkMode === 'function') {
        frameWin.toggleDarkMode();
        const isNowDark = html.classList.contains('dark');
        assert(S, 'toggleDarkMode toggles dark class', isNowDark !== wasDark, `Before: ${wasDark}, After: ${isNowDark}`);

        frameWin.toggleDarkMode();
        assert(S, 'Second toggle restores original', html.classList.contains('dark') === wasDark);
    } else {
        addResult(S, 'toggleDarkMode not available', 'skip');
    }

    const lightIcon = frameDoc.getElementById('lightIcon');
    const darkIcon = frameDoc.getElementById('darkIcon');
    assert(S, 'Light mode icon exists', !!lightIcon);
    assert(S, 'Dark mode icon exists', !!darkIcon);
}

document.getElementById('radarFrame').addEventListener('load', function() {
    log('Iframe loaded, ready to run tests.');
});
</script>
</body>
</html>
