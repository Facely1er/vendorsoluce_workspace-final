# VendorSoluce – Platform App (Netlify)
# Use this config for the platform deploy (www.platform.vendorsoluce.com).
# IMPORTANT: In Netlify UI set Base directory to empty (repo root). Do not use packages/app as base.
# - For the marketing website: create a separate site with Base = packages/website, Config = packages/website/netlify.toml
# - For the vendor risk portal: same build as platform, deploy to a second site with custom domain www.portal.vendorsoluce.com
#
# Environment variables: Copy env.netlify.example to env.netlify, fill values, then run:
#   netlify env:import env.netlify
# Or use scripts/set-netlify-env.ps1 to generate env.netlify from packages/app/.env.local

[build]
  command = "npm ci --include=dev --no-audit && npm run build:app"
  publish = "packages/app/dist"

[build.environment]
  NODE_VERSION = "20"
  CI = "true"
  # Disable Vercel Analytics script on Netlify (/_vercel/insights/script.js 404s here, causing MIME type errors)
  VITE_VERCEL_ANALYTICS = "false"
  # Disable Netlify's smart secret detection — all VITE_* vars are intentionally public client-side
  # identifiers (Stripe price IDs, payment links, Supabase anon key/URL). Smart detection flags these
  # as false positives. Standard secret scanning still runs for any vars explicitly marked as secrets.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Serve static assets with correct MIME types (must come before SPA catch-all)
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = false

# SPA: serve index.html for all other routes so client-side router works
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://rsms.me https://fonts.googleapis.com; font-src 'self' https://rsms.me https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.osv.dev https://www.googletagmanager.com https://www.google-analytics.com https://region1.google-analytics.com https://region1.analytics.google.com https://dfklqsdfycwjlcasfciu.supabase.co https://*.supabase.co https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Ensure correct MIME types for assets (fallback)
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"
