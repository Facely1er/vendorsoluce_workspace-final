# VendorSoluce marketing website (static HTML under packages/website).
#
# Netlify (www): Base directory = (empty / repo root). Set Configuration file to this file:
#   netlify.www.toml
#
# There is intentionally no default repo-root netlify.toml so Netlify cannot auto-pick the
# platform Vite app for the marketing site. See NETLIFY_DEPLOYMENT.md.

[build]
  command = "npm ci --include=dev --no-audit --no-fund && npm run build -w vendorsoluce-static"
  publish = "packages/website"

[build.environment]
  NODE_VERSION = "20"
  CI = "true"
  NODE_OPTIONS = "--max-old-space-size=6144"
  NPM_CONFIG_AUDIT = "false"
  NPM_CONFIG_FUND = "false"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.tailwindcss.com https://plausible.io https://www.googletagmanager.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://rsms.me https://fonts.googleapis.com; font-src 'self' https://rsms.me https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://plausible.io https://www.googletagmanager.com https://www.google-analytics.com https://analytics.google.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/homepage_files/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
