name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --include=dev
      - name: Verify UI governance (Tailwind + inline colors)
        run: npm run verify:ui
      - name: Build marketing website
        run: npm run build:website
      - name: Verify marketing website (links, radar, SEO, chrome)
        run: npm run verify -w vendorsoluce-static
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Build app
        run: npm run build:app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          CI: 'true'
      - name: Run tests
        run: npm run test -- --run
        env:
          CI: 'true'
